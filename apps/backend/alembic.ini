# Alembic configuration for the AI Recruiter Intelligence System backend.
# Run from apps/backend: `alembic upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is set at runtime by alembic/env.py from DatabaseSettings
# (pydantic-settings reads apps/backend/.env), so this stays blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
