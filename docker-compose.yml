# Phase 1 local infrastructure.
#
# Start everything with:
#   docker compose up --build
#
# Services: db (PostgreSQL 16), backend (FastAPI :8000), frontend (nginx :5173).
# Phase 1 intentionally has no Redis/Celery/workers — those belong to later phases.

name: ai-recruiter-phase1

services:
  db:
    image: postgres:16-alpine
    container_name: ai-recruiter-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter-dev-secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai_recruiter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-recruiter} -d $${POSTGRES_DB:-ai_recruiter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: ai-recruiter-backend
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recruiter}:${POSTGRES_PASSWORD:-recruiter-dev-secret}@db:5432/${POSTGRES_DB:-ai_recruiter}
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: ai-recruiter-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
