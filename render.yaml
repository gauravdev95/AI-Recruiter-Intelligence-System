# Render Blueprint — free single-service deploy of Phase 1.
#
# Architecture: ONE free web service runs everything same-origin —
# FastAPI API + the built React SPA (SERVE_FRONTEND=true). Same-origin keeps
# the HttpOnly refresh cookie working (it uses SameSite=Lax).
# Database: Neon Postgres (free tier, no expiry) — paste its connection string
# into DATABASE_URL when Render asks for the `sync: false` values.
#
# Deploy: Render dashboard → New → Blueprint → select this repo.

services:
  - type: web
    name: ai-recruiter-phase1
    runtime: python
    plan: free
    branch: main
    buildCommand: >-
      pip install -r apps/backend/requirements.txt &&
      cd apps/frontend &&
      npm ci &&
      npm run build &&
      rm -rf ../backend/static &&
      mkdir -p ../backend/static &&
      cp -r dist/. ../backend/static/
    preDeployCommand: "cd apps/backend && alembic upgrade head"
    startCommand: "cd apps/backend && uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Fill in on first deploy (Render prompts for `sync: false` keys):
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string, postgresql://...
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://ai-recruiter-phase1.onrender.com
      - key: FRONTEND_BASE_URL
        sync: false # same as ALLOWED_ORIGINS
